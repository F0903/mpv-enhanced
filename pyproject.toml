[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[project]
name = "mpv-enhanced"
version = "3.0.0"
description = "Installer for mpv-enhanced"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "lupa==2.8",
    "numpy==2.5.2",
    "ruff==0.16.3",
]

[project.scripts]
mpv-enhanced = "mpv_enhanced.cli:main"

[project.urls]
Repository = "https://github.com/F0903/mpv-rife"

[tool.uv]
# Rebuild the (non-editable) installer when its source changes, e.g. after git pull.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv.build-backend]
module-name = "mpv_enhanced"
module-root = "src"

[tool.ruff]
extend-exclude = ["portable_config"]

[tool.basedpyright]
include = ["src", "tests"]
# Off because they aren't about types: results such as Path.write_text's count
# are routinely ignored, and long messages are wrapped as adjacent literals.
reportUnusedCallResult = false
reportImplicitStringConcatenation = false

# Tests are held to real type errors only: their helpers and fakes aren't
# annotated, and the Lua modules they drive have no types at all.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "src", "portable_config"]
reportAny = false
reportExplicitAny = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingParameterType = false
reportUnannotatedClassAttribute = false
reportUninitializedInstanceVariable = false
reportImplicitOverride = false
reportPrivateUsage = false
reportUnusedParameter = false
