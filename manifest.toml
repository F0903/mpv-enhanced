schema_version = 1
default_profile = "core"

# The values the MPV Enhanced menu offers. The 4K limit is DCI-wide so that
# cropped and DCI video count as 4K.
[interpolation]
resolutions = [
    { label = "720p", width = 1280, height = 720 },
    { label = "1080p", width = 1920, height = 1080 },
    { label = "1440p", width = 2560, height = 1440 },
    { label = "4K", width = 4096, height = 2160 },
    { label = "8K", width = 8192, height = 4320 },
]
frame_rates = [24, 30, 48, 60, 120]
multipliers = [2, 3, 4]
fps_cutoffs = [30, 48, 60, 90, 120]
default_fps_cutoff = 60

# The installer's methods screen lists these in this order, and the first that
# can run starts ticked unless `preselect` is false. `extras` are optional
# dependency groups of the uv runtime. Each choice is one entry in the player's
# menu: `rank` is its quality order (1 is best) and `settings` go to the filter.
[methods.rtx]
description = "RTX Video Frame Generation in High, Medium and Low; needs an RTX 40 series or newer"
components = ["nvidia-rtx-gpu", "rife-runtime"]
extras = ["rtx"]
os.windows.arch = ["x86_64"]

[[methods.rtx.choices]]
id = "rtx-high"
title = "RTX High"
rank = 1
settings = { interpolator = "rtx", rtx_mode = "HIGH" }

[[methods.rtx.choices]]
id = "rtx-medium"
title = "RTX Medium"
rank = 2
settings = { interpolator = "rtx", rtx_mode = "MEDIUM" }

[[methods.rtx.choices]]
id = "rtx-low"
title = "RTX Low"
rank = 7
settings = { interpolator = "rtx", rtx_mode = "LOW" }

[methods.rife]
description = "RIFE with the 4.25-lite and 4.25 models; needs an NVIDIA GPU"
components = ["system-mpv-vapoursynth", "nvidia-gpu", "rife-runtime", "rife-model", "rife-model-full"]
os.windows.arch = ["x86_64"]
os.linux.arch = ["x86_64"]

[[methods.rife.choices]]
id = "rife-4.25"
title = "RIFE 4.25"
rank = 5
settings = { interpolator = "rife", rife_model = "4.25", tensorrt = false }

[[methods.rife.choices]]
id = "rife-4.25-lite"
title = "RIFE 4.25-lite"
rank = 6
settings = { interpolator = "rife", rife_model = "4.25.lite", tensorrt = false }

# Everything `rife` installs and offers, plus these choices.
[methods.rife-tensorrt]
extends = "rife"
description = "Faster RIFE using NVIDIA TensorRT; engines are compiled on first use"
extras = ["tensorrt"]
preselect = false

[[methods.rife-tensorrt.choices]]
id = "rife-4.25-tensorrt"
title = "RIFE 4.25 TensorRT"
rank = 3
settings = { interpolator = "rife", rife_model = "4.25", tensorrt = true }

[[methods.rife-tensorrt.choices]]
id = "rife-4.25-lite-tensorrt"
title = "RIFE 4.25-lite TensorRT"
rank = 4
settings = { interpolator = "rife", rife_model = "4.25.lite", tensorrt = true }

# A component whose `os` table omits the host OS is skipped, so `mpv` is
# downloaded on Windows/macOS and `system-mpv` is checked on Linux.
[profiles.core]
description = "mpv and the enhanced portable configuration, without Python or AI dependencies"
components = ["system-mpv", "mpv", "portable-config"]
os.windows.arch = ["x86_64"]
os.linux.arch = ["x86_64"]
os.macos.arch = ["aarch64", "x86_64"]

# In a download's url and destination, `{version}` is the component's version
# and `{site_packages}` is the RIFE environment's site-packages directory.
# Fields set on the component apply to every platform listed under `os`.
[components.mpv]
kind = "download"
version = "0.42.0"

# mingw "full" needs no VC++ redistributable and has the VapourSynth R74+ loader.
[components.mpv.os.windows.arch.x86_64]
url = "https://github.com/mpv-player/mpv/releases/download/v{version}/mpv-v{version}-x86_64-w64-mingw32-full.zip"
sha256 = "c7d4ff6a67dd33659f71d81efa56335fea2213c7522fd67235f3abf0d9ea1dbd"
archive = "zip"
exclude = [
    "libbluray-awt-j2se-1.5.1.jar",
    "libbluray-j2se-1.5.1.jar",
    "mpv-register.bat",
    "mpv-unregister.bat",
]

[components.mpv.os.macos.arch.aarch64]
url = "https://github.com/mpv-player/mpv/releases/download/v{version}/mpv-v{version}-macos-15-arm.zip"
sha256 = "be1b8d2445e6880860869c080b8710dee189721f1fa4689840db6a2c10d7be69"
archive = "zip+tar.gz"

[components.mpv.os.macos.arch.x86_64]
url = "https://github.com/mpv-player/mpv/releases/download/v{version}/mpv-v{version}-macos-15-intel.zip"
sha256 = "2d2f34350ff844b6014c35f21ca142937275e19c0c673150a8564fcd2f3bfa14"
archive = "zip+tar.gz"

# NVIDIA's frame generation runs on Ada (RTX 40) and Blackwell (RTX 50) or newer.
[components.nvidia-rtx-gpu]
kind = "gpu"
matches = 'GeForce RTX [4-9]\d{3}|RTX \d+ Ada|RTX PRO \d+'
requirement = "an NVIDIA RTX 40 series or newer GPU"
os.windows.arch = ["x86_64"]

[components.nvidia-gpu]
kind = "gpu"
matches = 'GeForce|Quadro|Tesla|RTX|GRID'
requirement = "an NVIDIA GPU"
os.windows.arch = ["x86_64"]
os.linux.arch = ["x86_64"]

# mpv publishes no Linux builds, so Linux uses the distribution's mpv.
[components.system-mpv]
kind = "system"
command = "mpv"
min_version = "0.36.0"
os.linux.arch = ["x86_64"]

# RIFE needs mpv's vapoursynth filter, which loads VapourSynth R74+ at runtime.
[components.system-mpv-vapoursynth]
kind = "system"
command = "mpv"
min_version = "0.42.0"
check_args = ["--vf=help"]
check_contains = "vapoursynth"
os.linux.arch = ["x86_64"]

# Optional components can be added to any profile, from the menu or with --with NAME.
# `setup` asks for one value and writes `line` to `file`, unless `file` already exists.
[components.mpvfin]
kind = "download"
optional = true
description = "Jellyfin cast target: play to mpv from any Jellyfin app"
version = "0.1.0"
url = "https://github.com/F0903/mpvfin/releases/download/v{version}/mpvfin.dll"
sha256 = "fb2bfa88d59d9640c01589566b7c69acd36be8a756df30237b723832f0e359ac"
destination = "portable_config/scripts/mpvfin.dll"
setup.question = "Jellyfin server URL"
setup.file = "portable_config/script-opts/mpvfin.conf"
setup.line = "server={answer}\n"
setup.matches = 'https?://\S+'
os.windows.arch = ["x86_64"]

[components.portable-config]
kind = "local"
path = "portable_config"
destination = "portable_config"

# Python comes from .python-version, and the packages from this project's uv.lock.
[components.rife-runtime]
kind = "uv-runtime"
project = "runtime/rife"

[components.rife-model]
kind = "download"
version = "4.25.lite"
url = "https://github.com/HolyWu/vs-rife/releases/download/model/flownet_v{version}.pkl"
sha256 = "81cdba223fe72a120130cc8552e5d2ecac824259d406f0c15323b3decf96b8b1"
destination = "{site_packages}/vsrife/models/flownet_v{version}.pkl"
os.windows.arch = ["x86_64"]
os.linux.arch = ["x86_64"]

# Upstream says 4.25 significantly improved anime scenes.
[components.rife-model-full]
extends = "rife-model"
version = "4.25"
sha256 = "6615790efd627772917205db291f51cd392528a157ecbb2ecaeec3bff8eb6de2"
