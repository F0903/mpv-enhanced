schema_version = 1

[release]
version = "0.1.0-dev"

[metadata]
hash_algorithm = "sha256"

# Official upstream builds: versioned release URLs that are never deleted.
[components.mpv]
kind = "download"
version = "0.42.0"
description = "Official mpv release build"
source = "https://github.com/mpv-player/mpv/releases/tag/v0.42.0"
platforms = ["windows", "macos"]

# mingw "full" needs no VC++ redistributable and has the VapourSynth R74+ loader.
[components.mpv.artifacts.windows-x86_64]
url = "https://github.com/mpv-player/mpv/releases/download/v0.42.0/mpv-v0.42.0-x86_64-w64-mingw32-full.zip"
sha256 = "c7d4ff6a67dd33659f71d81efa56335fea2213c7522fd67235f3abf0d9ea1dbd"
size = 65699428
archive = "zip"
exclude = [
    "libbluray-awt-j2se-1.5.1.jar",
    "libbluray-j2se-1.5.1.jar",
    "mpv-register.bat",
    "mpv-unregister.bat",
]

[components.mpv.artifacts.macos-aarch64]
url = "https://github.com/mpv-player/mpv/releases/download/v0.42.0/mpv-v0.42.0-macos-15-arm.zip"
sha256 = "be1b8d2445e6880860869c080b8710dee189721f1fa4689840db6a2c10d7be69"
size = 48835385
archive = "zip+tar.gz"

[components.mpv.artifacts.macos-x86_64]
url = "https://github.com/mpv-player/mpv/releases/download/v0.42.0/mpv-v0.42.0-macos-15-intel.zip"
sha256 = "2d2f34350ff844b6014c35f21ca142937275e19c0c673150a8564fcd2f3bfa14"
size = 53343668
archive = "zip+tar.gz"

# mpv publishes no Linux builds, so Linux uses the distribution's mpv.
[components.system-mpv]
kind = "system"
description = "Distribution mpv on PATH"
command = "mpv"
min_version = "0.36.0"
platforms = ["linux"]

[components.system-mpv-vapoursynth]
kind = "system"
description = "mpv 0.42+ with the vapoursynth filter (loads VapourSynth R74+ at runtime)"
command = "mpv"
min_version = "0.42.0"
check_args = ["--vf=help"]
check_contains = "vapoursynth"
platforms = ["linux"]

[components.portable-config]
kind = "local"
version = "repository"
description = "mpv-enhanced configuration and bundled scripts"
path = "portable_config"
destination = "portable_config"

[components.rife-runtime]
kind = "uv-runtime"
version = "locked"
description = "VapourSynth, vsrife, and CUDA PyTorch environment"
python_version = "3.12.13"
project = "runtime/rife"
lockfile = "runtime/rife/uv.lock"
extras = []

[components.rife-tensorrt]
kind = "uv-runtime"
version = "locked"
description = "TensorRT extension for the shared RIFE environment"
python_version = "3.12.13"
project = "runtime/rife"
lockfile = "runtime/rife/uv.lock"
extras = ["tensorrt"]

[components.rife-model-4-25-lite]
kind = "download"
version = "4.25.lite"
description = "RIFE 4.25-lite interpolation model"
source = "https://github.com/HolyWu/vs-rife"

[components.rife-model-4-25-lite.artifacts.windows-x86_64]
url = "https://github.com/HolyWu/vs-rife/releases/download/model/flownet_v4.25.lite.pkl"
sha256 = "81cdba223fe72a120130cc8552e5d2ecac824259d406f0c15323b3decf96b8b1"
size = 24467405
archive = "none"
destination = "runtime/venv/Lib/site-packages/vsrife/models/flownet_v4.25.lite.pkl"

[components.rife-model-4-25-lite.artifacts.linux-x86_64]
url = "https://github.com/HolyWu/vs-rife/releases/download/model/flownet_v4.25.lite.pkl"
sha256 = "81cdba223fe72a120130cc8552e5d2ecac824259d406f0c15323b3decf96b8b1"
size = 24467405
archive = "none"
destination = "runtime/venv/lib/python3.12/site-packages/vsrife/models/flownet_v4.25.lite.pkl"
