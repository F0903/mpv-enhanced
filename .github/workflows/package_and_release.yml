name: Test and release

on:
  push:
    branches: [installer]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the uv pin
        shell: bash
        run: echo "UV_PIN=$(sed -n 's/^version=//p' uv.pin)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_PIN }}
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv lock --check && uv lock --check --project runtime/rife

      # Exercise the real bootstrap: pinned uv download, hash check, core install.
      - name: Install core (Windows, mpve.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: call mpve.cmd install --profile core --yes --install-dir "%RUNNER_TEMP%\mpv-enhanced"
      - name: Bootstrap through Git Bash (Windows, mpve.sh)
        if: runner.os == 'Windows'
        shell: bash
        run: ./mpve.sh list-profiles
      - name: Install core (macOS)
        if: runner.os == 'macOS'
        run: |
          ./mpve.sh install --profile core --yes --install-dir "$RUNNER_TEMP/mpv-enhanced"
          "$RUNNER_TEMP/mpv-enhanced/mpv.app/Contents/MacOS/mpv" --config-dir="$RUNNER_TEMP/mpv-enhanced/portable_config" --version
      - name: Install core (Linux, distro mpv)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv
          ./mpve.sh install --profile core --yes --install-dir "$RUNNER_TEMP/mpv-enhanced"
          mpv --config-dir="$RUNNER_TEMP/mpv-enhanced/portable_config" --version

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the tag to match pyproject.toml
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="mpv-enhanced-$GITHUB_REF_NAME"
          git archive --format=zip --prefix="$name/" -o "$name.zip" HEAD
          sha256sum "$name.zip" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "$name.zip" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --generate-notes
