# Start in fullscreen mode by default.
fs=no

# For UOSC
osc=no
osd-bar=no
border=no
cursor-autohide=1000


#
#   HWACCELL
#
vo=gpu-next
# gpu-api is left on auto: Windows probes d3d11 first (flip model is the default).
hwdec=auto-copy


#
#   VIDEO
#
hr-seek-framedrop=no
video-sync=audio # Some prefer having this set to display-resample


#
#   AUDIO
#
audio-exclusive=no # Enable this if you only want audio from mpv.

#
#   SUBTITLES
#
sub-color="#FFFF00" # Yellow subtitles

#
#   COLOR SETTINGS
#
target-colorspace-hint=yes
target-prim=auto # Set to your display primaries or auto
target-trc=auto # Set to your display gamma or auto
video-output-levels=full
target-peak=auto # Adjust to display peak HDR brightness.
allow-delayed-peak-detect=no
tone-mapping=auto


#
#   SCALING
#
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
deband=yes

#
#   LOGGING
#
#log-file="./mpv-enhanced-log.txt"
#msg-level="vapoursynth=trace"

#
#   PROFILES
#
[interpolation]
vf-add=@interpolation:vapoursynth="~~/interpolation.vpy"

# User-owned overrides are kept outside the managed configuration so upgrades
# can replace this file without overwriting local preferences.
[default]
include=~~/mpv-local.conf
